name: CI/CD Pipeline - Azure DevSecOps Guardrails

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies & Lint
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Unit Tests
      run: |
        pytest -v

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker Image to ACR
      run: |
        docker build -t ${{ secrets.ACR_SERVER }}/azure-devsecops-guardrails:${{ github.sha }} -t ${{ secrets.ACR_SERVER }}/azure-devsecops-guardrails:latest .
        docker push ${{ secrets.ACR_SERVER }}/azure-devsecops-guardrails:${{ github.sha }}
        docker push ${{ secrets.ACR_SERVER }}/azure-devsecops-guardrails:latest